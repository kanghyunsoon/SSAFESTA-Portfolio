<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">SSAFESTA 측정 전후 비교</title>
  <desc id="desc">축제 구역 드로우콜, 아바타 카탈로그 메모리, 11인 수신 트래픽의 전후 측정값</desc>
  <rect width="1000" height="520" rx="24" fill="#0b1220"/>
  <text x="52" y="64" fill="#f8fafc" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700">측정으로 남긴 변화</text>
  <text x="52" y="96" fill="#94a3b8" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">각 항목의 이전 값을 100%로 두고 비교했습니다.</text>

  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <text x="52" y="148" fill="#e2e8f0" font-size="18" font-weight="600">축제 구역 드로우콜</text>
    <rect x="300" y="126" width="620" height="24" rx="12" fill="#f97316" opacity="0.9"/>
    <rect x="300" y="160" width="132" height="24" rx="12" fill="#38bdf8"/>
    <text x="930" y="145" text-anchor="end" fill="#fed7aa" font-size="16">1,088</text>
    <text x="446" y="179" fill="#bae6fd" font-size="16">231 · -79%</text>

    <text x="52" y="258" fill="#e2e8f0" font-size="18" font-weight="600">아바타 카탈로그 메모리</text>
    <rect x="300" y="236" width="620" height="24" rx="12" fill="#f97316" opacity="0.9"/>
    <rect x="300" y="270" width="246" height="24" rx="12" fill="#38bdf8"/>
    <text x="930" y="255" text-anchor="end" fill="#fed7aa" font-size="16">490.3 MB</text>
    <text x="560" y="289" fill="#bae6fd" font-size="16">194.3 MB · -60%</text>

    <text x="52" y="368" fill="#e2e8f0" font-size="18" font-weight="600">11인 수신 트래픽</text>
    <rect x="300" y="346" width="620" height="24" rx="12" fill="#f97316" opacity="0.9"/>
    <rect x="300" y="380" width="466" height="24" rx="12" fill="#38bdf8"/>
    <text x="930" y="365" text-anchor="end" fill="#fed7aa" font-size="16">4,529 KB/s</text>
    <text x="780" y="399" fill="#bae6fd" font-size="16">3,290~3,505 KB/s · 약 -25%</text>

    <rect x="52" y="448" width="14" height="14" rx="7" fill="#f97316"/>
    <text x="76" y="460" fill="#cbd5e1" font-size="15">변경 전</text>
    <rect x="154" y="448" width="14" height="14" rx="7" fill="#38bdf8"/>
    <text x="178" y="460" fill="#cbd5e1" font-size="15">변경 후</text>
    <text x="948" y="460" text-anchor="end" fill="#64748b" font-size="14">측정 조건은 항목마다 다르며 technical-notes.md에 기록</text>
  </g>
</svg>
